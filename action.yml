name: "Breakpoint Verify"
description: >
  Adversarially verifies a Python function with real sandboxed execution —
  a Skeptic model writes tests aimed at breaking it, they run for real,
  and the verdict is a fact, not a second LLM's opinion. Reports findings
  as a PR comment; never rewrites your code.
author: "asim-aa"
branding:
  icon: "shield"
  color: "purple"

inputs:
  file:
    description: "Path to one Python file to verify. Omit if using diff-base instead."
    required: false
    default: ""
  diff-base:
    description: >
      Git ref to diff against (e.g. the PR's base branch) — auto-detects every
      changed .py file instead of requiring an exact path. Exactly one of
      `file` or `diff-base` must be set.
    required: false
    default: ""
  context:
    description: "Optional context to help infer the spec (e.g. the PR description)"
    required: false
    default: ""
  openrouter-api-key:
    description: "OpenRouter API key"
    required: true
  prover-model:
    description: "Model used to infer the spec from the existing code"
    required: true
  skeptic-model:
    description: "Model used to write adversarial tests (must differ from prover-model)"
    required: true
  post-comment:
    description: "Post the report as a PR comment (requires the default GITHUB_TOKEN)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Run Breakpoint verification
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        PROVER_MODEL: ${{ inputs.prover-model }}
        SKEPTIC_MODEL: ${{ inputs.skeptic-model }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -n "${{ inputs.file }}" ]; then
          ARGS=(--file "${{ inputs.file }}")
        elif [ -n "${{ inputs.diff-base }}" ]; then
          ARGS=(--diff-base "${{ inputs.diff-base }}")
        else
          echo "Set exactly one of 'file' or 'diff-base'." >&2
          exit 2
        fi
        ARGS+=(--context "${{ inputs.context }}")
        if [ "${{ inputs.post-comment }}" = "true" ]; then
          ARGS+=(--post-comment)
        fi
        python "${{ github.action_path }}/action/verify_pr.py" "${ARGS[@]}"
