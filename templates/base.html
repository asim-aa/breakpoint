<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Breakpoint{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.5;
    }
    nav { margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #8884; }
    nav a { margin-right: 16px; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid #8882; }
    th { font-size: 0.85em; text-transform: uppercase; opacity: 0.7; }
    code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
    pre {
      background: #8881;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pass { color: #2e8b57; }
    .fail { color: #c0392b; }
    .verdict-converged, .verdict-round_passed { color: #2e8b57; }
    .verdict-unresolved, .verdict-bugs_found { color: #c0392b; }
    .muted { opacity: 0.65; font-size: 0.9em; }
    .round { margin: 20px 0; padding: 12px 16px; border: 1px solid #8884; border-radius: 8px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Runs</a>
    <a href="/patterns">Bug Patterns</a>
    <a href="/leaderboard">Leaderboard</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
